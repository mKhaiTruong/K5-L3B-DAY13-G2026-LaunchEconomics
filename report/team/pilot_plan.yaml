# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: hệ số thiết kế 2,48 → 3.103 yêu cầu mỗi nhóm → 42 người mỗi nhóm, tổng 84 > 40 người: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000 < 1.251: không đạt
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300: không đạt
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi người (hệ số thiết kế 6,96, hiệu dụng 859)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian:
#   2. Chia ngẫu nhiên hay do người chọn:
#   3. Ảnh hưởng gián tiếp và cách giảm:
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước:
#   5. Ít nhất 20 cụm mỗi nhóm:
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: 4,25% (51/1.200, cả mẫu), 3,97% (39/982, noi_dia + hang_nang); ngưỡng an toàn: xem luật dừng thứ nhất

pilot:
  owner: "Giám đốc vận hành LogiX-VN"  # một người có tên vai trò, không ghi "cả đội"
  scope: "Chỉ noi_dia và hang_nang (so với 12.000 đ: 0,22x và 0,69x, simulated). Loại quoc_te (1,88x, thành công 27,3%, simulated) và doi_tac (0,85x, có điều khoản riêng) nằm ngoài phạm vi"  # loại yêu cầu nào, depot nào; dựa vào kết quả A3
  assignment:
    unit: "staff"                 # request | staff | depot
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # chờ nhóm chốt 0,05 hay 0,06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96           # 1 nếu chia theo yêu cầu
    clusters_per_arm: 20          # để trống nếu chia theo yêu cầu
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot với nhóm dùng trợ lý, không mở trợ lý"
    spillover_risk: "Nhân viên cùng depot có thể chia sẻ câu trả lời của trợ lý; giảm bằng quyền truy cập theo tài khoản và ghi log lượt mở trợ lý theo staff_id"
    predeclared: "Chỉ số chính, ngưỡng, luật dừng, seed bốc thăm và ngày quyết định được chốt trước ngày bắt đầu"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm dùng trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên, hoặc vượt trần tuyệt đối 6% (mức hiện tại 4,25%), TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ (simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý (sửa hoặc bỏ) vượt 40% (mức hiện tại 27,12%) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"  # ai bấm, mất bao lâu, khách được phục vụ bằng gì
  decision_date: "2027-01-15"
  simulated_inputs:
    - "phut_xem_lai_simulated (890 phút trong mẫu 1.200 yêu cầu)"
    - "phut_lam_lai_simulated (1.132 phút trong mẫu)"
    - "chi phí mỗi việc thành công 4.472 đ và ngưỡng chi phí 8.000 đ suy ra từ đó"
    - "chi phí cố định 40 triệu đ mỗi tháng và khối lượng 45.000 yêu cầu mỗi tháng (giả định của lab)"
